<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Pratique leitura e escuta de frases HSK com destaque em tempo real" />
  
  <title>HSK 朗读 · Frases</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="splash-logo">
        <svg viewBox="0 0 120 120" width="96" height="96">
          <defs>
            <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="54" fill="#1e293b" stroke="url(#amberGrad)" stroke-width="4"/>
          <text x="60" y="72" text-anchor="middle" font-size="48" font-weight="700" fill="url(#amberGrad)" font-family="-apple-system, system-ui, sans-serif">中</text>
          <circle cx="88" cy="32" r="10" fill="#f59e0b" opacity="0.9"/>
        </svg>
      </div>
      <h1 class="splash-title">HSK 朗读</h1>
      <p class="splash-sub">Leitura + Escuta em tempo real</p>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app hidden">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="app-title">HSK 朗读</h1>
      </div>
      <div class="header-right">
        <button id="btnSettings" class="icon-btn" aria-label="Configurações" title="Configurações">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="frases">Frases</button>
      <button class="tab" data-tab="estudo">Estudo</button>
      <button class="tab" data-tab="progresso">Progresso</button>
    </nav>

    <!-- Main Content -->
    <main id="main" class="main">
      <!-- Conteúdo renderizado via JS -->
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
</body>
</html>
