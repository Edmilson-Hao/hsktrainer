<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0f172a"/>
  <circle cx="256" cy="256" r="220" fill="#1e293b" stroke="url(#g)" stroke-width="12"/>
  
  <!-- Main character 中 -->
  <text x="256" y="310" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="200" font-weight="700" fill="url(#g)" filter="url(#glow)">中</text>
  
  <!-- Sound wave accent -->
  <circle cx="380" cy="140" r="28" fill="#f59e0b" opacity="0.95"/>
  <path d="M400 120 Q420 140 400 160" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M420 105 Q450 140 420 175" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>